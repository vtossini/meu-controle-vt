<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#006437">
<meta name="description" content="Controle financeiro pessoal com dados cifrados só no seu aparelho.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
@font-face{font-family:Carlito;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/carlito-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Carlito;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/carlito-latin-700-normal.woff2) format("woff2")}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}

<title>Meu Controle</title>
<script src="vendor/exceljs.min.js" defer></script>
<style>
/* Layout: sidebar + conteudo no desktop; barra inferior no celular. Identidade VT (verde, azul, grafite). */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface2:#E4E9E6; --ink:#17231D; --muted:#66726B; --line:#D5DBD7;
  --brand:#006437; --brand-ink:#FFFFFF; --brand-soft:#BFE3CE; --accent:#2D5DA8; --input:#FFF9C4;
  --pos:#247A4B; --pos-bg:#E8F5ED; --neg:#7A1F2B; --neg-bg:#F6E4E7; --shadow:0 1px 2px rgba(23,35,29,.08);
  --f-title:Calibri,Carlito,'Segoe UI',system-ui,sans-serif; --f-body:'Calibri Light',Calibri,Carlito,'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1511; --surface:#16211B; --surface2:#1F2D25; --ink:#E7EEE9; --muted:#9AA8A0; --line:#2A3A31;
  --brand:#2F9A63; --brand-ink:#06150D; --brand-soft:#BFE3CE; --accent:#7FA6E6; --input:#2B2A12;
  --pos:#5CC48A; --pos-bg:#173324; --neg:#E58A97; --neg-bg:#3A1A21; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1511; --surface:#16211B; --surface2:#1F2D25; --ink:#E7EEE9; --muted:#9AA8A0; --line:#2A3A31;
  --brand:#2F9A63; --brand-ink:#06150D; --brand-soft:#BFE3CE; --accent:#7FA6E6; --input:#2B2A12;
  --pos:#5CC48A; --pos-bg:#173324; --neg:#E58A97; --neg-bg:#3A1A21; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
h1,h2,h3,.t{font-family:var(--f-title);font-weight:700;margin:0;letter-spacing:-.005em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.hide-sm{display:none}

/* ---------- tela de bloqueio ---------- */
.lock{min-height:100svh;display:grid;place-items:center;padding-block:32px}
.lock-card{width:100%;max-width:400px;display:grid;gap:18px}
.lock-brand{display:flex;align-items:center;gap:14px}
.lock-brand h1{font-size:30px}
.lock-brand p{margin:0;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.lbl{font-family:var(--f-title);font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.02em}
.inp{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-height:44px}
.inp.in{background:var(--input);color:var(--accent);border-color:var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-title);font-weight:700}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff}
.btn.block{width:100%}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent)}
.err{color:var(--neg);min-height:1.2em;margin:0 0 10px;font-size:14px}
.note{font-size:14px;color:var(--muted);margin:0}
.lock-links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- app ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100svh}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .brand{display:flex;align-items:center;gap:10px}
.top .brand b{font-family:var(--f-title);font-size:20px}
.spacer{flex:1}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.monthnav button{width:40px;height:40px;border-radius:999px;border:0;background:transparent;font-size:18px}
.monthnav span{min-width:76px;text-align:center;font-family:var(--f-title);font-weight:700}
main{padding-bottom:110px;display:grid;gap:16px;align-content:start;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.tab{display:grid;justify-items:center;gap:2px;padding:6px 4px;border:0;background:none;color:var(--muted);font-family:var(--f-title);font-weight:700;font-size:12px;border-radius:10px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;height:52px;padding:0 20px;border-radius:999px;border:0;background:var(--brand);color:var(--brand-ink);
  font-family:var(--f-title);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);display:flex;align-items:center;gap:8px}
.demo{background:var(--input);color:var(--accent);border-radius:10px;padding:8px 12px;font-size:14px;font-family:var(--f-title);font-weight:700}

.hero{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:20px;display:grid;gap:14px}
.hero .lbl{color:var(--brand-soft)}
.hero .big{font-family:var(--f-title);font-weight:700;font-size:clamp(34px,9vw,46px);line-height:1}
.hero .row{display:flex;gap:24px;flex-wrap:wrap}
.hero .row div{display:grid;gap:2px}
.hero .row b{font-family:var(--f-title);font-size:20px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-family:var(--f-title);font-weight:700;background:var(--surface2);color:var(--ink);white-space:nowrap}
.pill.pos{background:var(--pos-bg);color:var(--pos)}
.pill.neg{background:var(--neg-bg);color:var(--neg)}
.hero .pill{background:rgba(255,255,255,.18);color:#fff}
.hero .pill.neg{background:var(--neg-bg);color:var(--neg)}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;min-width:0;align-content:start}
[hidden]{display:none!important}
.card h2{font-size:17px}
.bars{display:grid;gap:10px}
.bar{display:grid;gap:4px}
.bar .h{display:flex;justify-content:space-between;gap:8px}
.track{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}
.stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--surface2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.proj{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:150px}
.proj div{display:grid;grid-template-rows:1fr auto auto;height:100%;gap:2px;text-align:center;font-size:12px;min-width:0}
.proj .col{align-self:stretch;display:flex;align-items:flex-end;justify-content:center}
.proj .col i{display:block;width:70%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.proj .col.now i{background:var(--brand)}
.proj small{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-title);font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%;min-height:56px}
.item:last-child{border-bottom:0}
.item .d{min-width:0}
.item .d b{display:block;font-family:var(--f-title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .d small{color:var(--muted)}
.item .a{font-family:var(--f-title);font-weight:700;text-align:right}
.item .a.pos{color:var(--pos)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sec h2{font-size:18px}
.crow{display:flex;flex-wrap:wrap;gap:8px}
.cpill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;background:var(--surface)}
.cpill button{width:28px;height:28px;border-radius:50%;border:0;background:var(--surface2)}
.split{display:grid;gap:10px}

/* ---------- formularios ---------- */
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,18,14,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:92svh;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:20px;margin-bottom:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;margin-bottom:14px}
.seg label{display:grid;place-items:center;min-height:40px;border-radius:9px;font-family:var(--f-title);font-weight:700;font-size:14px;cursor:pointer;color:var(--muted)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--brand-ink)}
.seg label:has(input:checked){background:var(--brand);color:var(--brand-ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview{background:var(--pos-bg);color:var(--pos);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-family:var(--f-title);font-weight:700;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.actions .primary{flex:1}
.sheet.wide{max-width:760px}
.implist{max-height:46svh;overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin:12px 0}
.irow{display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.irow:last-child{border-bottom:0}
.irow.off{opacity:.5}
.irow .id{min-width:0}
.irow .id b{display:block;font-family:var(--f-title);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow .id small{color:var(--muted)}
.irow .ia{font-family:var(--f-title);font-weight:700}
.irow .ia.pos{color:var(--pos)}
.irow .ix{grid-column:2 / 4;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.irow select,.irow input[type=number]{min-height:36px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.irow input[type=number]{width:62px}
.ick input{width:22px;height:22px}
.bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bulk select{min-height:40px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-family:var(--f-title);font-weight:700;font-size:14px;max-width:92vw}

@media (min-width:900px){
  body{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
  .hide-sm{display:initial}
  .app{grid-template-columns:220px minmax(0,1fr);gap:32px;max-width:1180px;margin:0 auto}
  .side{display:grid;align-content:start;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100svh;padding:20px 0}
  .side .brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
  .side .brand b{font-family:var(--f-title);font-size:22px}
  .side .tab{grid-auto-flow:column;justify-content:start;justify-items:start;gap:12px;font-size:15px;padding:10px 12px}
  .side .tab[aria-current="page"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--brand)}
  .tabbar{display:none}
  .top .brand{display:none}
  main{padding-bottom:60px}
  .grid2{grid-template-columns:1fr 1fr}
  .fab{bottom:28px}
  .toast{bottom:28px}
  .ov{align-items:center}
  .sheet{border-radius:18px}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:0}}}
</style>

</head>
<body>
<div id="root"></div>

<script>
/* ============ configuracao ============ */
const STANDALONE=true;             /* o build para hospedagem troca para true */
const FEEDBACK_EMAIL='';           /* ex.: 'voce@email.com' (opcional) */
const FEEDBACK_WHATSAPP='5511992668138';        /* ex.: '5511999999999' (opcional) */
/* ============ utilitarios ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const mShort=i=>MES[((i%12)+12)%12]+'/'+String(Math.floor(i/12)).slice(2);
const mLong=i=>{const s=new Date(Math.floor(i/12),((i%12)+12)%12,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return s;};
const idxOf=d=>{const p=d.split('-');return (+p[0])*12+(+p[1])-1;};
const todayStr=()=>new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const parseMoney=v=>{v=String(v||'').trim().replace(/[R$\s]/g,'');if(!v)return NaN;if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');const n=parseFloat(v);return isFinite(n)?n:NaN;};
const fmtDate=d=>d?d.split('-').reverse().join('/'):'';
function logo(bg='#006437',bowl='#FFFFFF',wave='#BFE3CE',size=40){
  return `<svg width="${size}" height="${size}" viewBox="0 0 120 120" role="img" aria-label="Logo VT"><circle cx="60" cy="60" r="60" fill="${bg}"/><g transform="translate(60 60) scale(0.9) translate(-53 -63)" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M 24 40 C 26 70 38 86 53 86 C 68 86 80 70 82 40" stroke="${bowl}" stroke-width="10"/><path d="M 40 48 C 44 40 49 40 53 48 C 57 56 62 56 66 48" stroke="${wave}" stroke-width="9"/></g></svg>`;
}
const ICON={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>',
  wallet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.3 3h-4l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>'
};

/* ============ estado ============ */
const DEFAULT_CATS=[['Moradia','#006437'],['Alimentação','#2D5DA8'],['Transporte','#66726B'],['Saúde','#7A1F2B'],['Educação','#247A4B'],['Lazer','#5B7FB8'],['Pessoal','#9AA6A0'],['Outros','#B25563']];
const PALETTE=['#006437','#2D5DA8','#66726B','#7A1F2B','#247A4B','#5B7FB8','#9AA6A0','#B25563','#8A6D1F','#3E8E8E'];
const KIND={fixo:'Fixo',parcelado:'Parcelado',pontual:'Pontual'};
const KCOL={fixo:'#006437',parcelado:'#2D5DA8',pontual:'#9AA6A0'};
let S=null, KEY=null, SALT=null, DEMO=false, tab='home', cur=0, filter='all', lockTimer=null, saveTimer=null;

function freshState(){return {rules:{},cut:25,cats:DEFAULT_CATS.map(([name,color])=>({id:uid(),name,color})),entries:[],incomes:[],invests:[]};}
function demoState(){
  const s=freshState(); const c=n=>s.cats.find(x=>x.name===n).id;
  const t=new Date(); const y=t.getFullYear(), m=t.getMonth();
  const d=(off,day)=>{const dt=new Date(y,m+off,day);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;};
  s.entries=[
    {id:uid(),kind:'fixo',desc:'Aluguel',amount:2450,cat:c('Moradia'),date:d(-5,5)},
    {id:uid(),kind:'fixo',desc:'Escola',amount:1180,cat:c('Educação'),date:d(-4,10)},
    {id:uid(),kind:'fixo',desc:'Plano de saúde',amount:640,cat:c('Saúde'),date:d(-5,8)},
    {id:uid(),kind:'fixo',desc:'Internet',amount:119.9,cat:c('Moradia'),date:d(-3,12)},
    {id:uid(),kind:'parcelado',desc:'Geladeira',amount:3600,inst:12,cat:c('Moradia'),date:d(-2,14)},
    {id:uid(),kind:'parcelado',desc:'Tênis de corrida',amount:699.9,inst:3,cat:c('Pessoal'),date:d(0,6)},
    {id:uid(),kind:'pontual',desc:'Supermercado',amount:812.4,cat:c('Alimentação'),date:d(0,3)},
    {id:uid(),kind:'pontual',desc:'Pizza em família',amount:96,cat:c('Lazer'),date:d(0,8)},
    {id:uid(),kind:'pontual',desc:'Combustível',amount:240,cat:c('Transporte'),date:d(0,9)},
  ];
  s.incomes=[{id:uid(),kind:'salario',desc:'Salário',amount:7800,date:d(-5,5),rec:true},{id:uid(),kind:'outra',desc:'Venda de bicicleta',amount:900,date:d(0,12),rec:false}];
  s.invests=[{id:uid(),inst:'Tesouro Selic',date:d(-1,28),balance:11200},{id:uid(),inst:'Tesouro Selic',date:d(0,1),balance:11610},{id:uid(),inst:'CDB Banco X',date:d(0,1),balance:5230}];
  return s;
}
const nowIdx=()=>{const t=new Date();return t.getFullYear()*12+t.getMonth();};

/* ============ regras de competencia ============ */
function startIdx(e){if(e.comp&&e.kind!=='fixo')return idxOf(e.comp+'-01');let i=idxOf(e.date);if(e.kind==='parcelado'&&+e.date.slice(8,10)>S.cut)i++;return i;}
function outItems(mi){
  const r=[];
  for(const e of S.entries){const s=startIdx(e);
    if(e.kind==='pontual'){if(s===mi)r.push({e,amt:e.amount,tag:''});}
    else if(e.kind==='fixo'){const end=e.end?idxOf(e.end+'-01'):Infinity;if(mi>=s&&mi<=end)r.push({e,amt:e.amount,tag:'todo mês'});}
    else{const k=mi-s;if(k>=0&&k<e.inst)r.push({e,amt:e.amount/e.inst,tag:`${k+1}/${e.inst}`});}
  }
  return r;
}
function inItems(mi){
  const r=[];
  for(const e of S.incomes){const s=idxOf(e.date);
    if(!e.rec){if(s===mi)r.push({e,amt:e.amount});}
    else{const end=e.end?idxOf(e.end+'-01'):Infinity;if(mi>=s&&mi<=end)r.push({e,amt:e.amount});}
  }
  return r;
}
const sum=a=>a.reduce((t,x)=>t+x.amt,0);
function investLatest(){
  const m={};for(const v of S.invests){if(!m[v.inst]||v.date>=m[v.inst].date)m[v.inst]=v;}
  return Object.values(m).sort((a,b)=>b.balance-a.balance);
}
const catOf=id=>S.cats.find(c=>c.id===id)||{name:'Sem categoria',color:'#9AA6A0'};

/* ============ criptografia (PBKDF2 + AES-GCM, tudo no aparelho) ============ */
const enc=new TextEncoder(),dec=new TextDecoder();
const toB64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveRaw(pw,salt){
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
  return crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,256);
}
const aesFromRaw=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function deriveKey(pw,salt){return aesFromRaw(await deriveRaw(pw,salt));}
async function encryptState(){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(S)));
  return JSON.stringify({v:1,salt:toB64(SALT),iv:toB64(iv),data:toB64(ct)});
}
const VKEY='vt.cofre.v1';
const readVault=()=>{try{return localStorage.getItem(VKEY);}catch(e){return null;}};
let storageOk=true;
function persist(){
  if(DEMO||!KEY)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{const v=await encryptState();localStorage.setItem(VKEY,v);}catch(e){toast('Não foi possível salvar neste navegador. Exporte um backup.');}
  },250);
}
async function flushSave(){clearTimeout(saveTimer);if(DEMO||!KEY)return;try{localStorage.setItem(VKEY,await encryptState());}catch(e){}}


/* ============ entrada com biometria (passkey + extensao PRF, tudo no aparelho) ============ */
const BIOKEY='vt.bio.v1';
function bioMeta(){try{return JSON.parse(localStorage.getItem(BIOKEY)||'null');}catch(e){return null;}}
const bioSupported=()=>STANDALONE&&!!window.PublicKeyCredential&&!!navigator.credentials&&window.isSecureContext;
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function prfKey(secret){
  const hk=await crypto.subtle.importKey('raw',secret,'HKDF',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'HKDF',hash:'SHA-256',salt:new Uint8Array(32),info:enc.encode('meu-controle-bio-v1')},hk,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function bioCard(){
  const on=!!bioMeta(),ok=bioSupported();
  return `<section class="card"><h2>Entrada com biometria</h2>
    <p class="note">${on?'Ativada neste aparelho. Na tela de entrada aparece o botão Entrar com biometria. A senha continua valendo.':
      (ok?'Entre com o desbloqueio do próprio aparelho (rosto, digital ou PIN), sem digitar a senha. O app nunca recebe a sua imagem nem a sua digital: quem faz a verificação é o sistema do aparelho.':
      'Este aparelho ou navegador não oferece o recurso necessário. Você continua entrando com a senha.')}</p>
    ${ok?`<div class="actions">${on?'<button class="btn danger" data-act="bio-off">Desativar</button>':'<button class="btn" data-act="bio-on">Ativar biometria</button>'}</div>`:''}</section>`;
}
function bioForm(){
  openSheet(`<h2>Ativar biometria</h2>
  <form id="bf"><p class="note" style="margin-bottom:12px">Confirme sua senha. Em seguida o aparelho pedirá o rosto, a digital ou o PIN para criar a chave de acesso.</p>
  <div class="field"><label for="bpw">Senha</label><input class="inp" id="bpw" type="password" autocomplete="current-password" required></div>
  <p class="err" id="berr" role="alert"></p>
  <div class="actions"><button class="btn primary">Continuar</button><button type="button" class="btn" id="bno">Cancelar</button></div></form>`,ov=>{
    $('#bno',ov).onclick=closeSheet;
    $('#bf',ov).addEventListener('submit',async ev=>{
      ev.preventDefault();const err=$('#berr',ov),btn=ev.submitter||$('button.primary',ov);btn.disabled=true;err.textContent='';
      try{await enableBio($('#bpw',ov).value);closeSheet();render();toast('Biometria ativada');}
      catch(e){
        err.textContent=e&&e.message==='senha'?'Senha incorreta.':(e&&e.message==='noprf'?'Este aparelho não oferece o recurso necessário.':(e&&e.name==='NotAllowedError'?'Verificação cancelada.':'Não foi possível ativar a biometria neste aparelho.'));
        btn.disabled=false;
      }
    });
  });
}
async function enableBio(pw){
  const v=JSON.parse(readVault()||'null');if(!v)throw new Error('vault');
  const salt=fromB64(v.salt);const raw=await deriveRaw(pw,salt);
  try{await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(v.iv)},await aesFromRaw(raw),fromB64(v.data));}catch(e){throw new Error('senha');}
  const prfSalt=rnd(32);
  const cred=await navigator.credentials.create({publicKey:{rp:{name:'Meu Controle',id:location.hostname},user:{id:rnd(16),name:'meu-controle',displayName:'Meu Controle'},
    challenge:rnd(32),pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',residentKey:'preferred',userVerification:'required'},timeout:60000,extensions:{prf:{eval:{first:prfSalt}}}}});
  let secret=cred.getClientExtensionResults().prf?.results?.first;
  if(!secret){
    const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:cred.rawId}],userVerification:'required',extensions:{prf:{eval:{first:prfSalt}}}}});
    secret=a.getClientExtensionResults().prf?.results?.first;
  }
  if(!secret)throw new Error('noprf');
  const iv=rnd(12);const wrap=await crypto.subtle.encrypt({name:'AES-GCM',iv},await prfKey(secret),raw);
  localStorage.setItem(BIOKEY,JSON.stringify({v:1,id:toB64(cred.rawId),salt:toB64(prfSalt),iv:toB64(iv),wrap:toB64(wrap)}));
}
async function unlockBio(){
  const m=bioMeta(),v=JSON.parse(readVault()||'null');if(!m||!v)throw new Error('sem biometria');
  const a=await navigator.credentials.get({publicKey:{challenge:rnd(32),rpId:location.hostname,allowCredentials:[{type:'public-key',id:fromB64(m.id)}],userVerification:'required',extensions:{prf:{eval:{first:fromB64(m.salt)}}}}});
  const secret=a.getClientExtensionResults().prf?.results?.first;if(!secret)throw new Error('noprf');
  const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(m.iv)},await prfKey(secret),fromB64(m.wrap));
  SALT=fromB64(v.salt);KEY=await aesFromRaw(raw);
  try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(v.iv)},KEY,fromB64(v.data));S=JSON.parse(dec.decode(pt));}
  catch(e){KEY=null;SALT=null;try{localStorage.removeItem(BIOKEY);}catch(_){}throw new Error('stale');}
  enterApp();
}

/* ============ bloqueio ============ */
function resetLockTimer(){
  clearTimeout(lockTimer);
  if(!KEY&&!DEMO)return;
  lockTimer=setTimeout(()=>lock('Bloqueado por inatividade.'),5*60*1000);
}
['pointerdown','keydown'].forEach(ev=>addEventListener(ev,resetLockTimer,{passive:true}));
function lock(msg){
  clearTimeout(saveTimer);
  S=null;KEY=null;SALT=null;DEMO=false;closeSheet();
  renderLock(msg||'');
}
function renderLock(msg=''){
  clearTimeout(lockTimer);
  let hasVault=!!readVault();
  try{localStorage.getItem('x');}catch(e){storageOk=false;}
  $('#root').innerHTML=`
  <div class="lock"><div class="lock-card">
    <div class="lock-brand">${logo('#006437','#fff','#BFE3CE',64)}<div><h1>Meu Controle</h1><p>Suas finanças, só no seu aparelho.</p></div></div>
    <form class="panel" id="lockf" autocomplete="off">
      <div class="field"><label for="pw">${hasVault?'Senha':'Crie uma senha'}</label><input class="inp" id="pw" type="password" autocomplete="${hasVault?'current-password':'new-password'}" ${hasVault?'':'minlength="8"'} required></div>
      ${hasVault?'':`<div class="field"><label for="pw2">Repita a senha</label><input class="inp" id="pw2" type="password" autocomplete="new-password" required></div>
      <p class="note" style="margin-bottom:14px">A senha cifra seus dados neste aparelho e não existe recuperação. Anote com cuidado e guarde um backup (em Ajustes).</p>`}
      <p class="err" id="lockerr" role="alert">${esc(msg)}</p>
      <button class="btn primary block" id="lockgo">${hasVault?'Entrar':'Criar cofre'}</button>
    </form>
    ${hasVault&&STANDALONE&&bioMeta()?'<button class="btn block" id="biobtn" type="button">Entrar com biometria</button>':''}
    <div class="lock-links">
      <button class="btn ghost" id="demo">Ver com dados de exemplo</button>
      <label class="btn ghost" for="restore" style="cursor:pointer">Restaurar backup</label>
      <input id="restore" type="file" accept=".json,application/json" hidden>
    </div>
    ${storageOk?'':'<p class="note">Este navegador bloqueou o armazenamento local, então os dados não serão guardados.</p>'}
  </div></div>`;
  $('#lockf').addEventListener('submit',async ev=>{
    ev.preventDefault();
    const pw=$('#pw').value,err=$('#lockerr'),btn=$('#lockgo');
    err.textContent='';
    if(!hasVault){
      if(pw.length<8){err.textContent='Use pelo menos 8 caracteres.';return;}
      if(pw!==$('#pw2').value){err.textContent='As senhas não conferem.';return;}
    }
    btn.disabled=true;btn.textContent='Abrindo…';
    try{
      if(hasVault){
        const v=JSON.parse(readVault());SALT=fromB64(v.salt);
        KEY=await deriveKey(pw,SALT);
        try{const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(v.iv)},KEY,fromB64(v.data));S=JSON.parse(dec.decode(pt));}
        catch(e){KEY=null;SALT=null;err.textContent='Senha incorreta.';btn.disabled=false;btn.textContent='Entrar';return;}
      }else{
        SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await deriveKey(pw,SALT);S=freshState();await flushSave();
      }
      enterApp();
    }catch(e){err.textContent='Não foi possível abrir o cofre neste navegador.';btn.disabled=false;btn.textContent=hasVault?'Entrar':'Criar cofre';}
  });
  $('#demo').addEventListener('click',()=>{DEMO=true;S=demoState();enterApp();});
  const bb=$('#biobtn');if(bb)bb.addEventListener('click',async()=>{
    $('#lockerr').textContent='';bb.disabled=true;
    try{await unlockBio();}
    catch(e){$('#lockerr').textContent=(e&&e.name==='NotAllowedError')?'Biometria cancelada. Você pode entrar com a senha.':'Não foi possível usar a biometria agora. Entre com a senha.';bb.disabled=false;}
  });
  $('#restore').addEventListener('change',async ev=>{
    const f=ev.target.files[0];if(!f)return;
    try{const t=await f.text();const v=JSON.parse(t);if(!v.salt||!v.iv||!v.data)throw 0;localStorage.setItem(VKEY,t);localStorage.removeItem(BIOKEY);renderLock('Backup restaurado. Entre com a senha usada nele.');}
    catch(e){$('#lockerr').textContent='Arquivo de backup inválido.';}
  });
  setTimeout(()=>{const p=$('#pw');if(p)p.focus();},50);
}
function enterApp(){cur=nowIdx();tab='home';filter='all';resetLockTimer();render();if(!DEMO)countAccess();}

/* ============ casca do app ============ */
const TABS=[['home','Início','home'],['list','Lançamentos','list'],['in','Entradas','wallet'],['set','Ajustes','gear']];
const tabBtn=(t)=>`<button class="tab" data-tab="${t[0]}" ${tab===t[0]?'aria-current="page"':''}>${ICON[t[2]]}<span>${t[1]}</span></button>`;

  const showMonth=tab!=='set';
  let body='';
  if(tab==='home')body=viewHome();else if(tab==='list')body=viewList();else if(tab==='in')body=viewIn();else body=viewSet();

  <div class="app">

  </div>

}

/* ---------- Início ---------- */
function viewHome(){
  const out=outItems(cur),inn=inItems(cur);
  const tOut=sum(out),tIn=sum(inn),bal=tIn-tOut;
  const byCat={};out.forEach(x=>{byCat[x.e.cat]=(byCat[x.e.cat]||0)+x.amt;});
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const maxC=cats.length?cats[0][1]:1;
  const byKind={fixo:0,parcelado:0,pontual:0};out.forEach(x=>byKind[x.e.kind]+=x.amt);
  const proj=[];for(let i=0;i<6;i++){const mi=cur+i;const v=sum(outItems(mi).filter(x=>x.e.kind!=='pontual'));proj.push([mi,v]);}
  const maxP=Math.max(1,...proj.map(p=>p[1]));
  const inv=investLatest(),invTot=inv.reduce((t,v)=>t+v.balance,0);
  const hasAny=S.entries.length||S.incomes.length||S.invests.length;
  return `
  <section class="hero"><div class="lbl">SALDO DE ${esc(mLong(cur).toUpperCase())}</div>
    <div class="big num">${brl(bal)}</div>
    <div class="row"><div><span class="lbl">ENTRADAS</span><b class="num">${brl(tIn)}</b></div><div><span class="lbl">SAÍDAS</span><b class="num">${brl(tOut)}</b></div>
    <div style="align-self:end"><span class="pill ${bal<0?'neg':'pos'}">${bal<0?'No vermelho':'No azul'}</span></div></div></section>
  ${hasAny?'':`<div class="card"><h2>Comece por aqui</h2><p class="note">Registre seu salário em Entradas e depois lance suas despesas em Lançamentos. O resumo do mês aparece nesta tela.</p></div>`}
  <div class="grid2">
    <section class="card"><h2>Para onde foi o dinheiro</h2>
      ${cats.length?`<div class="bars">${cats.map(([id,v])=>{const c=catOf(id);return `<div class="bar"><div class="h"><span><i class="dot" style="background:${c.color}"></i>${esc(c.name)}</span><b class="num t">${brl(v)}</b></div><div class="track"><i style="width:${(v/maxC*100).toFixed(1)}%;background:${c.color}"></i></div></div>`;}).join('')}</div>`:'<p class="empty">Sem saídas neste mês.</p>'}
    </section>
    <section class="card"><h2>Por tipo de gasto</h2>
      ${tOut?`<div class="stack" role="img" aria-label="Distribuição por tipo">${Object.keys(byKind).map(k=>`<i style="width:${byKind[k]/tOut*100}%;background:${KCOL[k]}"></i>`).join('')}</div>
      <div class="legend">${Object.keys(byKind).map(k=>`<span><i class="dot" style="background:${KCOL[k]}"></i>${KIND[k]} <b class="num t">${brl(byKind[k])}</b></span>`).join('')}</div>`:'<p class="empty">Sem saídas neste mês.</p>'}
      <h2 style="margin-top:6px">Já comprometido nos próximos meses</h2>
      <div class="proj" role="img" aria-label="Fixos e parcelas dos próximos seis meses">${proj.map(([mi,v],i)=>`<div><span class="col${i===0?' now':''}"><i style="height:${Math.max(2,v/maxP*100)}%"></i></span><b class="num t" style="font-size:12px">${v>=1000?(v/1000).toFixed(1).replace('.',',')+'k':Math.round(v)}</b><small>${mShort(mi)}</small></div>`).join('')}</div>
      <p class="note">Soma de gastos fixos e parcelas já lançadas.</p>
    </section>
  </div>
  <section class="card"><div class="sec"><h2>Aplicações</h2><b class="num t" style="font-size:20px">${brl(invTot)}</b></div>
    ${inv.length?`<div class="bars">${inv.map(v=>`<div class="bar"><div class="h"><span>${esc(v.inst)} <span class="muted">· ${fmtDate(v.date)}</span></span><b class="num t">${brl(v.balance)}</b></div></div>`).join('')}</div>`:'<p class="empty">Nenhuma aplicação registrada. Adicione o saldo em Entradas.</p>'}
  </section>`;
}

/* ============ importacao de extrato / fatura ============ */
const NORM=x=>String(x||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const pad2=n=>String(n).padStart(2,'0');
async function readText(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf);}catch(e){return new TextDecoder('windows-1252').decode(buf);}}
function withYear(d,mo){let y=Math.floor(cur/12);if(y*12+mo-1>cur)y--;return `${y}-${pad2(mo)}-${pad2(d)}`;}
function validDate(y,m,d){return m>=1&&m<=12&&d>=1&&d<=31?`${y}-${pad2(m)}-${pad2(d)}`:null;}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return `${v.getUTCFullYear()}-${pad2(v.getUTCMonth()+1)}-${pad2(v.getUTCDate())}`;
  const s=String(v??'').trim();let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return validDate(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return validDate(y,+m[2],+m[1]);}
  if((m=s.match(/^(\d{4})(\d{2})(\d{2})/)))return validDate(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[\/.-](\d{1,2})$/)))return +m[2]>=1&&+m[2]<=12?withYear(+m[1],+m[2]):null;
  if((m=s.match(/^(\d{1,2})\s+(jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)/i)))return withYear(+m[1],MES.indexOf(m[2].toLowerCase())+1);
  return null;
}
function parseAmount(v){
  if(typeof v==='number')return v;
  let s=String(v??'').replace(/R\$|\s/g,'');if(!s)return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){neg=true;s=s.slice(1,-1);}
  if(s[0]==='-'){neg=true;s=s.slice(1);}else if(s[0]==='+')s=s.slice(1);
  if(s.endsWith('-')){neg=true;s=s.slice(0,-1);}
  if(/(DB|D)$/i.test(s)){neg=true;s=s.replace(/(DB|D)$/i,'');}
  s=s.replace(/(CR|C)$/i,'');
  if(!/^[\d.,]+$/.test(s))return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  const n=parseFloat(s);return isFinite(n)?(neg?-n:n):NaN;
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  const first=text.split(/\r?\n/).slice(0,12).join('\n');
  const cnt=c=>first.split(c).length-1;
  const delim=[';',',','\t'].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=ch;}
  if(cell||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function parseTable(rows){
  rows=rows.filter(r=>r&&r.some(c=>String(c??'').trim()!==''));
  let h=-1,dc=-1,sc=-1,vc=-1,deb=-1,cre=-1;
  for(let i=0;i<Math.min(rows.length,25);i++){
    const n=rows[i].map(c=>NORM(c));
    const d=n.findIndex(x=>/^(data|date|dt)/.test(x));
    const v=n.findIndex(x=>/^(valor|amount|value|quantia)/.test(x));
    const db=n.findIndex(x=>/^(debito|saida)/.test(x)),cr=n.findIndex(x=>/^(credito|entrada)/.test(x));
    if(d>=0&&(v>=0||(db>=0&&cr>=0))){h=i;dc=d;vc=v;deb=db;cre=cr;
      sc=n.findIndex((x,j)=>j!==d&&/(descri|histor|lancamento|estabelec|memo|nome|detalhe|titulo)/.test(x));break;}
  }
  const out=[];
  if(h>=0){
    if(sc<0){const cand=rows[h].map((_,j)=>j).filter(j=>![dc,vc,deb,cre].includes(j));sc=cand.length?cand[0]:-1;}
    for(const r of rows.slice(h+1)){
      const date=parseDate(r[dc]);if(!date)continue;
      let amt;
      if(vc>=0)amt=parseAmount(r[vc]);
      else{const a=Math.abs(parseAmount(r[deb])||0),b=Math.abs(parseAmount(r[cre])||0);amt=b-a;}
      if(!isFinite(amt)||amt===0)continue;
      out.push({date,desc:String(sc>=0?r[sc]:'').trim()||'(sem descrição)',amt});
    }
    return out;
  }
  for(const r of rows){
    let date=null,amt=NaN,desc='';
    r.forEach(c=>{
      if(!date){const d=parseDate(c);if(d){date=d;return;}}
      if(isNaN(amt)&&/\d[,.]\d{2}\s*[-CDcdr]*$/.test(String(c))){const a=parseAmount(c);if(isFinite(a)){amt=a;return;}}
      if(typeof c==='string'&&c.trim().length>desc.length)desc=c.trim();
    });
    if(date&&isFinite(amt)&&amt!==0)out.push({date,desc:desc||'(sem descrição)',amt});
  }
  return out;
}
function parseOFX(text){
  const out=[];const re=/<STMTTRN>([\s\S]*?)(?=<\/STMTTRN>|<STMTTRN>|<\/BANKTRANLIST>|$)/gi;let m;
  const tag=(b,t)=>{const x=b.match(new RegExp('<'+t+'>\\s*([^<\\r\\n]*)','i'));return x?x[1].trim():'';};
  while((m=re.exec(text))){
    const b=m[1];const date=parseDate(tag(b,'DTPOSTED'));const amt=parseAmount(tag(b,'TRNAMT'));
    if(!date||!isFinite(amt)||amt===0)continue;
    out.push({date,desc:tag(b,'MEMO')||tag(b,'NAME')||'(sem descrição)',amt});
  }
  return out;
}
function loadPdfJs(){
  if(window.pdfjsLib)return Promise.resolve();
  return new Promise((ok,no)=>{
    const sc=document.createElement('script');
    sc.src=STANDALONE?'vendor/pdf.min.js':'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload=()=>{try{
      if(STANDALONE){pdfjsLib.GlobalWorkerOptions.workerSrc='vendor/pdf.worker.min.js';ok();return;}
      const w=new Blob(['importScripts("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");'],{type:'text/javascript'});
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(w);ok();}catch(e){no(e);}};
    sc.onerror=()=>no(new Error('pdfjs'));document.head.appendChild(sc);
  });
}
async function pdfLines(file){
  await loadPdfJs();
  const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const lines=[];
  for(let p=1;p<=doc.numPages;p++){
    const tc=await (await doc.getPage(p)).getTextContent();
    const map=new Map();
    tc.items.forEach(it=>{
      if(!it.str.trim())return;const y=Math.round(it.transform[5]/3);let k=null;
      for(const kk of map.keys()){if(Math.abs(kk-y)<=1){k=kk;break;}}
      if(k===null){k=y;map.set(k,[]);}map.get(k).push({x:it.transform[4],s:it.str});
    });
    [...map.entries()].sort((a,b)=>b[0]-a[0]).forEach(([,items])=>lines.push(items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(' ').replace(/\s+/g,' ').trim()));
  }
  return lines;
}
async function parsePDF(file){
  const lines=await pdfLines(file);
  const re=/^(\d{1,2}[\/.]\d{1,2}(?:[\/.]\d{2,4})?|\d{1,2}\s+(?:jan|fev|mar|abr|mai|jun|jul|ago|set|out|nov|dez)[a-z]*\.?(?:\s+\d{4})?)\s+(.+?)\s+(?:R\$\s*)?(-?\s?\d{1,3}(?:\.\d{3})*,\d{2}\s*(?:-|CR|C|D|DB)?)$/i;
  const out=[];
  for(const ln of lines){
    const m=ln.match(re);if(!m)continue;
    const date=parseDate(m[1].trim());const amt=parseAmount(m[3]);
    if(!date||!isFinite(amt)||amt===0)continue;
    out.push({date,desc:m[2].trim(),amt});
  }
  return out;
}
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,no)=>setTimeout(()=>no(new Error('timeout')),ms))]);

const BUILTIN=[[/mercado|supermerc|padaria|ifood|restaurante|lanchonete|atacad|acougue|hortifruti/,'Alimentação'],[/uber|99 ?pop|posto|combust|estacion|pedagio|sem parar|ipiranga/,'Transporte'],[/farmac|drogaria|droga|hospital|clinica|unimed|laborat/,'Saúde'],[/netflix|spotify|cinema|ingresso|steam|disney|prime video|youtube/,'Lazer'],[/escola|curso|faculdade|udemy|colegio|mensalidade esc/,'Educação'],[/aluguel|condominio|energia|enel|cemig|sabesp|copasa|internet|vivo|claro|tim /,'Moradia']];
const ruleKey=d=>NORM(d).replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean).slice(0,2).join(' ');
function suggestCat(desc){
  S.rules=S.rules||{};
  const k=ruleKey(desc);if(S.rules[k]&&S.cats.some(c=>c.id===S.rules[k]))return S.rules[k];
  const n=NORM(desc);
  for(const [re,name] of BUILTIN){if(re.test(n)){const c=S.cats.find(x=>NORM(x.name)===NORM(name));if(c)return c.id;}}
  const o=S.cats.find(x=>NORM(x.name)==='outros');return (o||S.cats[0]).id;
}
function dupFn(){
  const A=new Set();
  S.entries.forEach(e=>{if(e.kind==='parcelado')A.add('P|'+NORM(e.desc)+'|'+e.inst);else A.add('E|'+e.date+'|'+e.amount.toFixed(2)+'|'+NORM(e.desc));});
  S.incomes.forEach(e=>A.add('I|'+e.date+'|'+e.amount.toFixed(2)));
  return r=>r.kind==='parcelado'?A.has('P|'+NORM(r.desc)+'|'+r.n):(r.kind==='income'?A.has('I|'+r.date+'|'+r.amount.toFixed(2)):A.has('E|'+r.date+'|'+r.amount.toFixed(2)+'|'+NORM(r.desc)));
}
let IMP=null;
function buildImportRows(){
  const isDup=dupFn();
  return IMP.list.map((x,i)=>{
    const sgn=IMP.flip?-x.amt:x.amt;const out=sgn<0;const a=Math.round(Math.abs(sgn)*100)/100;
    let kind=out?'pontual':'income',k=1,n=2,desc=x.desc;
    if(out){const m=desc.match(/(\d{1,2})\s*\/\s*(\d{1,2})\s*$/);
      if(m&&+m[2]>=2&&+m[2]<=60&&+m[1]>=1&&+m[1]<=+m[2]){kind='parcelado';k=+m[1];n=+m[2];desc=desc.replace(/\s*(parc(ela)?\.?\s*)?\d{1,2}\s*\/\s*\d{1,2}\s*$/i,'').trim()||desc;}}
    const r={i,date:x.date,desc,amount:a,out,kind,k,n,cat:suggestCat(desc)};
    r.dup=isDup(r);
    r.pay=out&&/(pag(amento|to)?\.?\s*(de\s*)?(fatura|cart)|fatura\s*(cart|paga)|pgto\s*cart)/.test(NORM(x.desc));
    r.sel=!r.dup&&!r.pay&&(out||IMP.mode==='extrato');
    return r;
  });
}

    else if(/\.pdf$/.test(nm))list=await withTimeout(parsePDF(file),40000);
    else if(/\.xlsx$/.test(nm)){
      const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
      const ws=wb.worksheets[0];const rows=[];
      ws.eachRow({includeEmpty:false},r=>{rows.push(r.values.slice(1).map(c=>c&&typeof c==='object'&&!(c instanceof Date)?(c.result??c.text??''):c));});
      list=parseTable(rows);
    }

    if(!list.length){toast('Não encontrei lançamentos neste arquivo.');return;}
    const isPdf=/\.pdf$/.test(nm);

    const pos=list.filter(x=>x.amt>0).length,neg=list.length-pos;

}

/* ============ importacao de aplicacoes (posicao de investimentos) ============ */
let INV=null;
const colLabel=(h,j)=>{const t=String(h&&h[j]!=null?h[j]:'').trim();return t||('Coluna '+(j+1));};
async function fileToRows(file){
  const nm=file.name.toLowerCase();
  if(/\.xlsx$/.test(nm)){
    const wb=new ExcelJS.Workbook();await wb.xlsx.load(await file.arrayBuffer());
    const ws=wb.worksheets[0];const rows=[];
    ws.eachRow({includeEmpty:false},r=>{rows.push(r.values.slice(1).map(c=>c&&typeof c==='object'&&!(c instanceof Date)?(c.result??c.text??''):c));});
    return rows;
  }
  if(/\.pdf$/.test(nm)){
    const lines=await withTimeout(pdfLines(file),40000);const out=[['Aplicação','Valor']];
    for(const ln of lines){
      const all=[...ln.matchAll(/(?:R\$\s*)?(\d{1,3}(?:\.\d{3})*,\d{2})(?!\d)/g)];
      if(!all.length)continue;
      const name=ln.slice(0,all[0].index).replace(/R\$\s*$/,'').trim();
      if(name.length<3||/^total/i.test(NORM(name)))continue;
      out.push([name,all[all.length-1][1]]);
    }
    return out;
  }
  return parseCSV(await readText(file));
}
function guessInvCols(rows){
  const rs=rows.map(r=>r||[]);let h=-1;
  for(let i=0;i<Math.min(rs.length,30);i++){
    const cells=rs[i].filter(c=>String(c??'').trim()!=='');
    const texty=cells.filter(c=>typeof c==='string'&&isNaN(parseAmount(c))&&!parseDate(c)).length;
    const next=rs.slice(i+1,i+4).some(r=>r.some(c=>isFinite(parseAmount(c))&&/\d/.test(String(c))));
    if(texty>=2&&next){h=i;break;}
  }
  const head=h>=0?rs[h]:[];const n=Math.max(0,...rs.slice(0,40).map(r=>r.length));
  const nh=Array.from({length:n},(_,j)=>NORM(head[j]));
  const find=(...res)=>{for(const re of res){const j=nh.findIndex(x=>re.test(x));if(j>=0)return j;}return -1;};
  let name=find(/^(produto|ativo|aplicacao|investimento|titulo|papel|nome|descricao)/,/(produto|ativo|aplicac|investimento|titulo|nome|descri|ticker|codigo)/);
  let val=find(/valor liquido/,/saldo liquido/,/saldo (atual|total|bruto)/,/valor (atual|bruto|total)/,/^saldo/,/posicao/,/^valor/,/(saldo|valor)/);
  const date=find(/^(data|posicao em|competencia|referencia)/,/data/);
  const inst=find(/(instituicao|corretora|banco|custodiante|emissor)/);
  if(name<0)name=Array.from({length:n},(_,j)=>j).find(j=>j!==val&&j!==date)??0;
  if(val<0){// coluna com mais numeros
    let best=-1,bc=0;for(let j=0;j<n;j++){if(j===name||j===date)continue;const c=rs.slice(h+1,h+30).filter(r=>isFinite(parseAmount(r[j]))&&/\d/.test(String(r[j]??''))).length;if(c>bc){bc=c;best=j;}}val=best;
  }
  return {h,head,n,cols:{name,val,date,inst}};
}
async function startInvImport(file){
  toast('Lendo arquivo…');
  try{
    const rows=(await fileToRows(file)).filter(r=>r&&r.some(c=>String(c??'').trim()!==''));
    if(!rows.length){toast('Não encontrei dados neste arquivo.');return;}
    const g=guessInvCols(rows);
    let pre=todayStr();
    for(const r of rows.slice(0,Math.max(g.h,0)+1)){for(const c of r){const m=String(c??'').match(/\d{2}[\/.]\d{2}[\/.]\d{4}/);if(m&&parseDate(m[0])){pre=parseDate(m[0]);break;}}}
    INV={name:file.name,rows,g,cols:g.cols,date:pre,pdf:/\.pdf$/i.test(file.name),list:[]};
    buildInvList();openInvImport();
  }catch(e){toast(/\.pdf$/i.test(file.name)?'Não consegui ler este PDF. Tente CSV ou Excel.':'Não consegui ler este arquivo.');}
}
function buildInvList(){
  const {rows,g,cols}=INV;INV.list=[];
  const known={};S.invests.forEach(v=>{known[NORM(v.inst)]=v.inst;});
  const isDup=(n,d)=>S.invests.some(v=>NORM(v.inst)===NORM(n)&&v.date===d);
  if(cols.name<0||cols.val<0)return;
  rows.slice(g.h+1).forEach((r,i)=>{
    let nm=String(r[cols.name]??'').trim();const bal=parseAmount(r[cols.val]);
    if(!nm||!isFinite(bal)||bal<0||/^total/.test(NORM(nm)))return;
    const inst=cols.inst>=0?String(r[cols.inst]??'').trim():'';
    const d=(cols.date>=0&&parseDate(r[cols.date]))||INV.date;
    nm=known[NORM(nm)]||nm;
    INV.list.push({i,name:nm,balance:Math.round(bal*100)/100,date:d,note:inst,dup:isDup(nm,d),sel:true});
  });
}

  const opts=(sel,optional)=>(optional?`<option value="-1" ${sel<0?'selected':''}>Não tem</option>`:'')+Array.from({length:g.n},(_,j)=>`<option value="${j}" ${sel===j?'selected':''}>${esc(colLabel(g.head,j))}${sample(j)?' (ex.: '+esc(sample(j))+')':''}</option>`).join('');
  openSheet(`
  <h2>Importar aplicações</h2>
  <p class="note" style="margin-bottom:12px"><b>${esc(INV.name)}</b>${INV.pdf?'. Em PDF a leitura é aproximada, confira os valores.':'. Indique em qual coluna está cada informação.'}</p>
  <div class="two">
    <div class="field"><label for="icn">Coluna do nome da aplicação</label><select class="inp" id="icn">${opts(INV.cols.name,false)}</select></div>
    <div class="field"><label for="icv">Coluna do saldo</label><select class="inp" id="icv">${opts(INV.cols.val,false)}</select></div>
    <div class="field"><label for="icd">Coluna da data (opcional)</label><select class="inp" id="icd">${opts(INV.cols.date,true)}</select></div>
    <div class="field"><label for="ici">Coluna da instituição (opcional)</label><select class="inp" id="ici">${opts(INV.cols.inst,true)}</select></div>
  </div>
  <div class="field"><label for="icdate">Data do saldo (usada quando o arquivo não tem data)</label><input class="inp in" id="icdate" type="date" value="${INV.date}" style="max-width:220px"></div>
  <div class="bulk"><button class="btn" id="vall" type="button">Marcar todos</button><button class="btn" id="vnone" type="button">Desmarcar</button></div>
  <div class="implist" id="invlist"></div>
  <p class="note" id="invnote" style="margin-bottom:12px"></p>
  <div class="actions"><button class="btn primary" id="invgo" type="button">Importar</button><button class="btn" id="invcancel" type="button">Cancelar</button></div>`,ov=>{
    paintInv();
    $('#invcancel',ov).onclick=closeSheet;$('#invgo',ov).onclick=confirmInv;
    ov.addEventListener('change',ev=>{
      const t=ev.target;
      if(['icn','icv','icd','ici'].includes(t.id)){INV.cols={name:+$('#icn',ov).value,val:+$('#icv',ov).value,date:+$('#icd',ov).value,inst:+$('#ici',ov).value};}
      else if(t.id==='icdate'){INV.date=t.value||todayStr();}
      else if(t.dataset.vsel!==undefined){INV.list[+t.closest('.irow').dataset.i].sel=t.checked;t.closest('.irow').classList.toggle('off',!t.checked);paintInvCount();return;}
      else return;
      buildInvList();paintInv();
    });
    $('#vall',ov).onclick=()=>{INV.list.forEach(x=>x.sel=true);paintInv();};
    $('#vnone',ov).onclick=()=>{INV.list.forEach(x=>x.sel=false);paintInv();};
  },true);
}
function paintInvCount(){
  const n=INV.list.filter(x=>x.sel).length;const b=$('#invgo');
  if(b){b.textContent=n?`Importar ${n} ${n===1?'aplicação':'aplicações'}`:'Nada marcado';b.disabled=!n;}
  const nt=$('#invnote');
  if(nt){const d=INV.list.filter(x=>x.dup).length;
    nt.textContent=(INV.list.length?'':'Nenhuma linha reconhecida. Confira as colunas escolhidas.')+(d?` ${d} já ${d>1?'existem':'existe'} na mesma data e será${d>1?'ão':''} atualizada${d>1?'s':''}.`:'');}
}
function paintInv(){
  const box=$('#invlist');if(!box)return;
  box.innerHTML=INV.list.length?INV.list.map((x,i)=>`
  <div class="irow${x.sel?'':' off'}" data-i="${i}">
    <label class="ick"><input type="checkbox" data-vsel ${x.sel?'checked':''} aria-label="Importar ${esc(x.name)}"></label>
    <div class="id"><b>${esc(x.name)}</b><small>${fmtDate(x.date)}${x.note?' · '+esc(x.note):''}${x.dup?' · atualiza o saldo existente':''}</small></div>
    <div class="ia num">${brl(x.balance)}</div>
  </div>`).join(''):'<div class="empty">Nada reconhecido com essas colunas.</div>';
  paintInvCount();
}
function confirmInv(){
  let n=0;
  for(const x of INV.list){
    if(!x.sel)continue;
    const ex=S.invests.find(v=>NORM(v.inst)===NORM(x.name)&&v.date===x.date);
    if(ex){ex.balance=x.balance;if(x.note)ex.note=x.note;}
    else S.invests.push({id:uid(),inst:x.name,date:x.date,balance:x.balance,note:x.note||''});
    n++;
  }
  persist();closeSheet();tab='in';render();toast(`${n} ${n===1?'aplicação importada':'aplicações importadas'}`);
}

/* ============ exportacao ============ */
async function logoPng(){
  const svg=logo('#FFFFFF','#006437','#17231D',192).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
  const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  try{
    const img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=url;});
    const c=document.createElement('canvas');c.width=c.height=192;c.getContext('2d').drawImage(img,0,0,192,192);
    return c.toDataURL('image/png');
  }finally{URL.revokeObjectURL(url);}
}
async function getDownloader(){
  let dl=null;try{dl=await window.claude?.use?.('downloads');}catch(e){}
  if(dl||!STANDALONE)return dl;
  return {save:async({filename,data})=>{
    const blob=data instanceof Blob?data:new Blob([data]);const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:'saved'};}};
}
async function exportXlsx(){
  const dl=await getDownloader();
  if(!dl){toast('Download indisponível nesta visualização.');return;}
  if(typeof ExcelJS==='undefined'){toast('Biblioteca de planilha não carregou. Recarregue a página.');return;}
  const year=Math.floor(cur/12);
  const wb=new ExcelJS.Workbook();wb.creator='Meu Controle';
  const font=(b,sz=11,col='17231D')=>({name:b?'Calibri':'Calibri Light',size:sz,bold:b,color:{argb:'FF'+col}});
  const fill=h=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+h}});
  const thin={style:'thin',color:{argb:'FFD5DBD7'}};
  const border={left:thin,right:thin,top:thin,bottom:thin};
  const NUM='#,##0.00;-#,##0.00;"-"';
  let logoId=null;try{logoId=wb.addImage({base64:await logoPng(),extension:'png'});}catch(e){}
  const band=(ws,cols,title,sub)=>{
    for(let r=1;r<=3;r++){ws.getRow(r).height=[28,20,8][r-1];for(let c=1;c<=cols;c++)ws.getCell(r,c).fill=fill('006437');}
    ws.getCell('B1').value=title;ws.getCell('B1').font=font(true,20,'FFFFFF');ws.getCell('B1').alignment={vertical:'bottom'};
    ws.getCell('B2').value=sub;ws.getCell('B2').font=font(false,12,'BFE3CE');ws.getCell('B2').alignment={vertical:'top'};
    if(logoId!==null)ws.addImage(logoId,{tl:{col:0.15,row:0.2},ext:{width:50,height:50}});
  };
  const head=(ws,row,labels)=>{labels.forEach((l,i)=>{const c=ws.getCell(row,i+1);c.value=l;c.font=font(true,11,'FFFFFF');c.fill=fill('006437');c.border=border;c.alignment={vertical:'middle',horizontal:i===0?'left':'center'};});ws.getRow(row).height=22;};

  /* Resumo do ano */
  const ws=wb.addWorksheet('Resumo '+year,{views:[{showGridLines:false,state:'frozen',xSplit:1,ySplit:5}]});
  ws.properties.tabColor={argb:'FF006437'};
  ws.getColumn(1).width=26;for(let c=2;c<=13;c++)ws.getColumn(c).width=12;ws.getColumn(14).width=14;
  band(ws,14,'Resumo financeiro '+year,'Meu Controle · valores calculados a partir dos seus lançamentos');
  ws.getCell('A1').value=null;
  const hdr=['Categoria'];for(let m=0;m<12;m++)hdr.push(mShort(year*12+m));hdr.push('Total');head(ws,5,hdr);
  const inRow=6;
  const rowLabel=(r,t,bold)=>{const c=ws.getCell(r,1);c.value=t;c.font=font(bold);c.border=border;};
  rowLabel(inRow,'Entradas',true);
  const perMonthOut=[];for(let m=0;m<12;m++)perMonthOut.push(outItems(year*12+m));
  for(let m=0;m<12;m++){const c=ws.getCell(inRow,m+2);c.value=Math.round(sum(inItems(year*12+m))*100)/100;c.font=font(false);c.fill=fill('E4E9E6');c.border=border;c.numFmt=NUM;}
  let r=inRow+1;const catFirst=r;
  S.cats.forEach(cat=>{
    rowLabel(r,cat.name,false);
    for(let m=0;m<12;m++){const v=perMonthOut[m].filter(x=>x.e.cat===cat.id).reduce((t,x)=>t+x.amt,0);const c=ws.getCell(r,m+2);c.value=Math.round(v*100)/100;c.font=font(false);c.fill=fill('E4E9E6');c.border=border;c.numFmt=NUM;}
    r++;
  });
  const catLast=r-1,totRow=r,balRow=r+1,accRow=r+2;
  const col=n=>ws.getColumn(n).letter;
  rowLabel(totRow,'Total de saídas',true);rowLabel(balRow,'Saldo do mês',true);rowLabel(accRow,'Saldo acumulado',true);
  for(let m=0;m<12;m++){
    const L=col(m+2);
    let c=ws.getCell(totRow,m+2);c.value={formula:`SUM(${L}${catFirst}:${L}${catLast})`};c.font=font(true);c.fill=fill('D3DDD7');c.border=border;c.numFmt=NUM;
    c=ws.getCell(balRow,m+2);c.value={formula:`${L}${inRow}-${L}${totRow}`};c.font=font(true);c.border=border;c.numFmt=NUM;
    c=ws.getCell(accRow,m+2);c.value={formula:m===0?`${L}${balRow}`:`${col(m+1)}${accRow}+${L}${balRow}`};c.font=font(true);c.border=border;c.numFmt=NUM;
  }
  for(let rr=inRow;rr<=catLast;rr++){const c=ws.getCell(rr,14);c.value={formula:`SUM(B${rr}:M${rr})`};c.font=font(true);c.fill=fill('D3DDD7');c.border=border;c.numFmt=NUM;}
  {const c=ws.getCell(totRow,14);c.value={formula:`SUM(B${totRow}:M${totRow})`};c.font=font(true);c.fill=fill('D3DDD7');c.border=border;c.numFmt=NUM;}
  {const c=ws.getCell(balRow,14);c.value={formula:`N${inRow}-N${totRow}`};c.font=font(true);c.border=border;c.numFmt=NUM;}
  ws.getCell(totRow,1).fill=fill('D3DDD7');
  const rule=(ref)=>ws.addConditionalFormatting({ref,rules:[
    {type:'cellIs',operator:'greaterThan',formulae:[0],style:{font:{color:{argb:'FF247A4B'},bold:true},fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFE8F5ED'}}}},
    {type:'cellIs',operator:'lessThan',formulae:[0],style:{font:{color:{argb:'FF7A1F2B'},bold:true},fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFF6E4E7'}}}}]});
  rule(`B${balRow}:N${accRow}`);
  ws.getCell(accRow+2,1).value='Células cinzas vêm do app; totais e saldos são fórmulas.';ws.getCell(accRow+2,1).font=font(false,10,'66726B');

  /* Lançamentos */
  const wl=wb.addWorksheet('Lançamentos',{views:[{showGridLines:false,state:'frozen',ySplit:5}]});
  wl.properties.tabColor={argb:'FF2D5DA8'};
  [14,32,18,12,10,16,16,12].forEach((w,i)=>wl.getColumn(i+1).width=w);
  band(wl,8,'Lançamentos','Fixos, parcelados e pontuais');wl.getCell('A1').value=null;
  head(wl,5,['Data','Descrição','Categoria','Tipo','Parcelas','Valor informado','Valor mensal','1º mês']);
  [...S.entries].sort((a,b)=>a.date<b.date?-1:1).forEach((e,i)=>{
    const rr=6+i;const vals=[new Date(e.date+'T12:00:00'),e.desc,catOf(e.cat).name,KIND[e.kind],e.kind==='parcelado'?e.inst:'',e.amount,e.kind==='parcelado'?Math.round(e.amount/e.inst*100)/100:e.amount,mShort(startIdx(e))];
    vals.forEach((v,j)=>{const c=wl.getCell(rr,j+1);c.value=v;c.font=font(false,11,j===5?'2D5DA8':'17231D');c.border=border;if(j===0)c.numFmt='dd/mm/yyyy';if(j>=5&&j<=6)c.numFmt=NUM;if(j===5)c.fill=fill('FFF9C4');if(j===6)c.fill=fill('E4E9E6');});
  });
  /* Entradas */
  const wi=wb.addWorksheet('Entradas',{views:[{showGridLines:false,state:'frozen',ySplit:5}]});
  wi.properties.tabColor={argb:'FF247A4B'};
  [14,32,16,14,14].forEach((w,i)=>wi.getColumn(i+1).width=w);
  band(wi,5,'Entradas','Salário e outras entradas');wi.getCell('A1').value=null;
  head(wi,5,['Início','Descrição','Tipo','Repete','Valor']);
  [...S.incomes].sort((a,b)=>a.date<b.date?-1:1).forEach((e,i)=>{
    const rr=6+i;[new Date(e.date+'T12:00:00'),e.desc,e.kind==='salario'?'Salário':'Outra',e.rec?'Todo mês':'Uma vez',e.amount].forEach((v,j)=>{const c=wi.getCell(rr,j+1);c.value=v;c.font=font(false,11,j===4?'2D5DA8':'17231D');c.border=border;if(j===0)c.numFmt='dd/mm/yyyy';if(j===4){c.numFmt=NUM;c.fill=fill('FFF9C4');}});
  });
  /* Aplicacoes */
  const wa=wb.addWorksheet('Aplicações',{views:[{showGridLines:false,state:'frozen',ySplit:5}]});
  wa.properties.tabColor={argb:'FF66726B'};
  [14,32,18,30].forEach((w,i)=>wa.getColumn(i+1).width=w);
  band(wa,4,'Aplicações','Histórico de saldos');wa.getCell('A1').value=null;
  head(wa,5,['Data','Aplicação','Saldo','Observação']);
  [...S.invests].sort((a,b)=>a.date<b.date?-1:1).forEach((e,i)=>{
    const rr=6+i;[new Date(e.date+'T12:00:00'),e.inst,e.balance,e.note||''].forEach((v,j)=>{const c=wa.getCell(rr,j+1);c.value=v;c.font=font(false,11,j===2?'2D5DA8':'17231D');c.border=border;if(j===0)c.numFmt='dd/mm/yyyy';if(j===2){c.numFmt=NUM;c.fill=fill('FFF9C4');}});
  });
  const buf=await wb.xlsx.writeBuffer();
  try{await dl.save({filename:`meu-controle-${year}.xlsx`,data:buf});toast('Planilha pronta');}
  catch(e){if(e&&e.code!=='declined')toast('Não foi possível baixar a planilha.');}
}
async function exportBackup(){
  const dl=await getDownloader();
  if(!dl){toast('Download indisponível nesta visualização.');return;}
  if(DEMO){toast('No modo exemplo não há dados para salvar.');return;}
  try{await flushSave();const v=await encryptState();await dl.save({filename:'meu-controle-backup.json',data:v});toast('Backup pronto');}
  catch(e){if(e&&e.code!=='declined')toast('Não foi possível gerar o backup.');}
}

/* ============ eventos ============ */
document.addEventListener('click',ev=>{
  if(!S)return;
  const t=ev.target.closest('button,[data-tab]');if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  const a=t.dataset.act;
  if(a==='prev'){cur--;render();}
  else if(a==='next'){cur++;render();}
  else if(a==='new-entry')entryForm();
  else if(a==='new-income')incomeForm();
  else if(a==='feedback')feedbackForm();
  else if(a==='bio-on')bioForm();
  else if(a==='bio-off'){try{localStorage.removeItem(BIOKEY);}catch(e){}toast('Biometria desativada');render();}
  else if(a==='import-invest'){const f=$('#invfile');if(f)f.click();}
  else if(a==='install'&&window.__dip){window.__dip.prompt();window.__dip=null;t.hidden=true;}
  else if(a==='fb-refresh')adminFeedback();
  else if(a==='import'){const f=$('#impfile');if(f)f.click();}
  else if(a==='new-invest')investForm();
  else if(a==='export-xlsx')exportXlsx();
  else if(a==='export-backup')exportBackup();
  else if(a==='lock')lock('');
  else if(a==='wipe'){
    if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Confirmar: apagar tudo';return;}
    try{localStorage.removeItem(VKEY);localStorage.removeItem(BIOKEY);}catch(e){}
    clearTimeout(saveTimer);S=null;KEY=null;DEMO=false;renderLock('Cofre apagado.');
  }
  else if(t.dataset.filter){filter=t.dataset.filter;render();}
  else if(t.dataset.edit){const e=S.entries.find(x=>x.id===t.dataset.edit);if(e)entryForm(e);}
  else if(t.dataset.editIn){const e=S.incomes.find(x=>x.id===t.dataset.editIn);if(e)incomeForm(e);}
  else if(t.dataset.editInv){const e=S.invests.find(x=>x.id===t.dataset.editInv);if(e)investForm(e);}
  else if(t.dataset.delcat){
    const id=t.dataset.delcat;
    if(S.entries.some(e=>e.cat===id)){toast('Esta categoria está em uso por lançamentos.');return;}
    if(S.cats.length<=1){toast('Mantenha ao menos uma categoria.');return;}
    S.cats=S.cats.filter(c=>c.id!==id);persist();render();
  }
});
document.addEventListener('change',ev=>{
  if(!S)return;
  if(ev.target.id==='invfile'){const f=ev.target.files[0];ev.target.value='';if(f)startInvImport(f);return;}
  if(ev.target.id==='impfile'){const f=ev.target.files[0];ev.target.value='';if(f)startImport(f);return;}
  if(ev.target.id==='cut'){const v=Math.min(31,Math.max(1,parseInt(ev.target.value)||25));S.cut=v;ev.target.value=v;persist();toast('Fechamento atualizado');}
});
document.addEventListener('submit',ev=>{
  if(!S)return;
  if(ev.target.id==='catf'){
    ev.preventDefault();const n=$('#catn').value.trim();if(!n)return;
    if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast('Essa categoria já existe.');return;}
    S.cats.push({id:uid(),name:n,color:PALETTE[S.cats.length%PALETTE.length]});persist();render();
  }
});
addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)flushSave();});

if(STANDALONE){
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();window.__dip=e;const b=$('#installbtn');if(b)b.hidden=false;});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}
renderLock();
